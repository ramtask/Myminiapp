<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>My Tasks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ac:#f97316}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,sans-serif;padding:16px 16px 90px}
h2{margin:0 0 14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:44px;font-weight:800;color:var(--ac);text-align:center;margin:6px 0}
.mut{color:var(--mut);font-size:13px;text-align:center}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--ac);margin-top:10px}
.btn.alt{background:#334155}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row small{color:var(--mut);display:block;margin-top:2px}
.row .btn{width:auto;margin:0;padding:10px 16px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:8px 8px 20px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:14px;padding:10px;font-weight:600}
nav button.on{color:var(--ac)}
.tab{display:none}.tab.on{display:block}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style></head><body>

<section id="home" class="tab on">
  <h2>Home</h2>
  <div class="card"><div class="mut">Aapke coins</div><div class="big" id="coins">0</div>
    <div class="mut">Aaj ke ads: <span id="adsLeft">0</span>/10</div>
    <button class="btn" onclick="watchAd()">Ad dekho, 10 coins pao</button>
    <button class="btn alt" onclick="dailyBonus()">Daily bonus lo (+50)</button>
  </div>
</section>

<section id="tasks" class="tab">
  <h2>Tasks</h2>
  <div class="card row"><div>Daily bonus<small>Har 24 ghante me ek baar, +50 coins</small></div><button class="btn" onclick="dailyBonus()">Lo</button></div>
  <div class="card row"><div>Ad dekho<small>Har ad par +10 coins, roz 10 tak</small></div><button class="btn" onclick="watchAd()">Dekho</button></div>
  <div class="card row"><div>Dost ko bulao<small>App ka link share karo</small></div><button class="btn" onclick="invite()">Share</button></div>
</section>

<section id="profile" class="tab">
  <h2>Profile</h2>
  <div class="card"><div class="mut">Naam</div><div id="uname" style="text-align:center;font-size:20px;font-weight:700">-</div></div>
  <div class="card"><div class="row"><span>Abhi ke coins</span><b id="p1">0</b></div>
    <div class="row" style="margin-top:10px"><span>Kul kamaye coins</span><b id="p2">0</b></div>
    <div class="row" style="margin-top:10px"><span>Aaj ke ads</span><b id="p3">0</b></div></div>
  <div class="mut">Coins abhi sirf is phone me save hain.</div>
</section>

<nav>
  <button class="on" onclick="tab('home',this)">Home</button>
  <button onclick="tab('tasks',this)">Tasks</button>
  <button onclick="tab('profile',this)">Profile</button>
</nav>
<div id="toast"></div>

<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const BLOCK_ID="12345"; // Adsgram se approval ke baad yahan asli Block ID likhna
const MAX_ADS=10,AD_COINS=10,DAILY=50,K="mytasks_v1";
let S={coins:0,total:0,ads:0,adsDay:"",bonusAt:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
const $=id=>document.getElementById(id);
const today=()=>new Date().toDateString();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function roll(){if(S.adsDay!==today()){S.adsDay=today();S.ads=0}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2500)}
function add(n){S.coins+=n;S.total+=n;save();render()}
function render(){roll();$("coins").textContent=S.coins;$("adsLeft").textContent=S.ads;
 $("p1").textContent=S.coins;$("p2").textContent=S.total;$("p3").textContent=S.ads+"/"+MAX_ADS;
 const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;$("uname").textContent=u?(u.first_name||u.username||"User"):"User"}
function tab(id,b){document.querySelectorAll(".tab").forEach(e=>e.classList.remove("on"));$(id).classList.add("on");
 document.querySelectorAll("nav button").forEach(e=>e.classList.remove("on"));b.classList.add("on")}
function dailyBonus(){const left=864e5-(Date.now()-S.bonusAt);
 if(left>0)return toast("Bonus "+Math.ceil(left/36e5)+" ghante baad milega");
 S.bonusAt=Date.now();add(DAILY);toast("+"+DAILY+" coins mile!")}
let AC=null;try{AC=window.Adsgram.init({blockId:BLOCK_ID})}catch(e){}
async function watchAd(){roll();
 if(S.ads>=MAX_ADS)return toast("Aaj ke "+MAX_ADS+" ads poore ho gaye. Kal aana!");
 if(!AC)return toast("Ad abhi available nahi hai");
 try{const r=await AC.show();if(r&&r.done){S.ads++;add(AD_COINS);toast("+"+AD_COINS+" coins mile!")}}
 catch(e){toast("Ad poora nahi dekha ya abhi available nahi hai")}}
function invite(){const l="https://t.me/Mohan999_bot/Tasks";
 tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(l)+"&text="+encodeURIComponent("Ye app try karo, daily tasks karo aur coins kamao!"))}
render();
</script></body></html>
